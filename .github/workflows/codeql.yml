name: "CodeQL Advanced SAST"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "15 2 * * 6"

jobs:
  analyze:
    name: Analisar (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # Transição obrigatória para o modo manual devido à topologia multi-diretório.
          - language: java
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          # O bloco de Rust foi removido. A sua avaliação é delegada ao Semgrep e Cargo Clippy.

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: Inicialização do Motor CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Compilação Manual Direcionada (Monorepo)
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          # Devido à estrutura monorepo, a compilação manual é necessária para garantir que o CodeQL capture adequadamente os artefatos de construção e as dependências.
          # por "./gradlew assemble".

          echo "A compilar a máquina de estados Kademlia..."
          cd Kademlia-network
          mvn clean package -DskipTests

          echo "A compilar os mecanismos do livro-razão e leilão..."
          cd ../blockchain-mechanisms
          mvn clean package -DskipTests

      - name: Execução das Consultas Relacionais e Exportação SARIF
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
