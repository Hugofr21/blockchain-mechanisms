name: Semgrep SAST

on:
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch: {}
    push:
        branches: ["main", "master"]
    schedule:
        - cron: "20 17 * * *" # Executa diariamente às 17:20 UTC

permissions:
    contents: read
    security-events: write

jobs:
    semgrep-sast-audit:
        name: Execute semgrep SAST audit
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep

        steps:
            - name: Repository Checkout
              uses: actions/checkout@v6
            - name: Analisys with Semgrep and generate SARIF report
              run: semgrep scan --config=.semgrep/rules.yml --sarif --output=semgrep.sarif --error
            - name: Injection the SARIF file into the GitHub Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: semgrep.sarif
                  category: semgrep-custom-rules
