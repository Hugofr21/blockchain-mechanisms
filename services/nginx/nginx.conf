worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;
        server_tokens off;

        location /api/bootstrap/ {
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            add_header Access-Control-Allow-Origin "http://localhost:3001" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Target-Node, Accept" always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            rewrite ^/api/bootstrap/(.*) /$1 break;
            proxy_pass http://bootstrap-node:8080;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

    
        location ~ "^/api/peer-(80[0-9]{2})/" {
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            add_header Access-Control-Allow-Origin "http://localhost:3001" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Target-Node, Accept" always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            set $peer_port $1;
            set $peer_host "peer-$1";

            rewrite "^/api/peer-[0-9]+/(.*)" /$1 break;
            proxy_pass http://$peer_host:$peer_port;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}